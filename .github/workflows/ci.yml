name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The whole theorem library (job theorem-library) takes longer than a pull request should wait: it runs by hand
  # and weekly.
  # The release workflow runs all of CI first, and attaches the outputs it verified.
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      # Replay every committed trace through the command-line tool as well, so the exit status is exercised.
      - name: Replay the fixture traces
        shell: bash
        run: |
          for f in Nat.add_succ Nat.add_succ.v3.0 eta437 acc436 quot syntax gate lenapp; do
            dotnet src/TenetZfc.Cli/bin/Release/net10.0/tenet-zfc.dll replay tests/fixtures/$f.ndjson tests/fixtures/$f.trace.ndjson
          done

      # The packaged tool: install it from its .nupkg and run it, so packaging and `run` are exercised on every OS.
      - name: Pack the dotnet tool, install it and run it
        shell: bash
        run: |
          dotnet pack src/TenetZfc.Cli -c Release --no-build -o "$RUNNER_TEMP/pkg"
          dotnet tool install tenet-zfc --tool-path "$RUNNER_TEMP/tool" --add-source "$RUNNER_TEMP/pkg" --prerelease
          "$RUNNER_TEMP/tool/tenet-zfc" --version
          curl -fsSL -o "$RUNNER_TEMP/set.mm" "https://raw.githubusercontent.com/metamath/set.mm/6315535f37e5e58d14ece8c34ddb204926446264/set.mm"
          "$RUNNER_TEMP/tool/tenet-zfc" run tests/fixtures/inductives.ndjson --decl Bool,Bool.true,Bool.false,Bool.rec --setmm "$RUNNER_TEMP/set.mm" --no-verify --out "$RUNNER_TEMP/run-out"

  # Emit set.mm proofs and check them with both Metamath verifiers. The tools and set.mm are pinned, so a run
  # verifies against exactly the database the proofs were written for.
  emit-and-verify:
    runs-on: ubuntu-latest
    env:
      SETMM_COMMIT: 6315535f37e5e58d14ece8c34ddb204926446264
      METAMATH_EXE_COMMIT: 580b4bd5ae6f2a0d746398b0033cddccba1b418b
      MMVERIFY_COMMIT: 63a2aa3815cd5bf67892dbfc7f2048cbb177524c
      MMJ2_COMMIT: c8dd05548139c7003220caedde65a7abe44a00bf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # mmj2's definitionCheck macro needs a JDK with Nashorn: Java 11, as set.mm's own CI uses.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
      - name: Fetch set.mm and the verifiers
        run: |
          mkdir -p "$RUNNER_TEMP/mm/setmm"
          curl -fsSL -o "$RUNNER_TEMP/mm/setmm/set.mm" "https://raw.githubusercontent.com/metamath/set.mm/$SETMM_COMMIT/set.mm"
          git clone -q https://github.com/metamath/metamath-exe "$RUNNER_TEMP/mm/metamath-exe"
          git -C "$RUNNER_TEMP/mm/metamath-exe" checkout -q "$METAMATH_EXE_COMMIT"
          cc -O2 -w -o "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP"/mm/metamath-exe/src/*.c
          git clone -q https://github.com/david-a-wheeler/mmverify.py "$RUNNER_TEMP/mm/mmverify"
          git -C "$RUNNER_TEMP/mm/mmverify" checkout -q "$MMVERIFY_COMMIT"
          mkdir -p "$RUNNER_TEMP/mm/mmj2/macros"
          raw="https://raw.githubusercontent.com/digama0/mmj2/$MMJ2_COMMIT/mmj2jar"
          curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/mmj2.jar" "$raw/mmj2.jar"
          for m in definitionCheck init; do curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/macros/$m.js" "$raw/macros/$m.js"; done
      - name: Both verifiers accept set.mm itself
        working-directory: ${{ runner.temp }}/mm/setmm
        run: |
          out=$("$RUNNER_TEMP/mm/metamath" "read set.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" set.mm
      # Every checker is set here, so a test skipped for a missing checker fails the step. Only the slow
      # TENET_ZFC_THEOREMS tests may skip (they are opt-in; the theorem steps below cover them).
      - name: Tests, with emitted proofs checked by both verifiers and mmj2's definitionCheck
        env:
          TENET_ZFC_SETMM: ${{ runner.temp }}/mm/setmm
          TENET_ZFC_METAMATH: ${{ runner.temp }}/mm/metamath
          TENET_ZFC_MMVERIFY: ${{ runner.temp }}/mm/mmverify/mmverify.py
          TENET_ZFC_JAVA: java
          TENET_ZFC_MMJ2: ${{ runner.temp }}/mm/mmj2
        run: |
          dotnet test tests/TenetZfc.Tests -c Release -f net10.0 --logger "trx;LogFileName=tests.trx" --results-directory "$RUNNER_TEMP/tr"
          scripts/check-no-checker-skips "$RUNNER_TEMP/tr/tests.trx"
      - name: Emit the gate theorems and verify them
        run: |
          for g in gate lenapp; do
            dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- emit tests/fixtures/$g.ndjson tests/fixtures/$g.trace.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/$g.mm"
            out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read $g.mm" "verify proof *" "exit")
            echo "$out" | tail -2
            if echo "$out" | grep -q '?Error'; then exit 1; fi
            (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" $g.mm)
          done
      # Proofs are compressed by default; the flat form stays available behind --uncompressed.
      - name: Emit lenapp with flat proofs and verify it
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- emit tests/fixtures/lenapp.ndjson tests/fixtures/lenapp.trace.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/lenapp-flat.mm" --uncompressed
          if grep -q '^ *( ' "$RUNNER_TEMP/mm/setmm/lenapp-flat.mm"; then echo "lenapp-flat.mm has compressed proofs"; exit 1; fi
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read lenapp-flat.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" lenapp-flat.mm)
      # The model's default is a tower of universes, one per level (docs/milestone3.md, "Tower mode"). Universe
      # parameters are instantiated at 0 unless a name gives levels: id.{1} is id at Type, where id.{0} is id at Prop. Quote such
      # names: bash expands Function.comp.{1,1,1} into three words.
      # Quotients and choice are in the tower too: Quot.{1} is a quotient of a type, Quot.{0} of a proposition (the
      # proposition itself), and Classical.choice.{1} takes one well-ordering of the tower's union.
      - name: Translate definitions and inductive types by the generic model and verify (milestone 3)
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/model.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/model.mm" 'id.{1}' 'Function.comp.{1,1,1}' 'Function.const.{1,1}'
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/inductives.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/ind.mm" Bool Bool.false Bool.true Prod Prod.mk Option Option.none Option.some Bool.rec Prod.rec Option.rec
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/props.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/props.mm" 'Eq.{1}' 'Eq.refl.{1}' 'Eq.rec.{1}' 'HEq.{1}' 'HEq.refl.{1}' 'HEq.rec.{1}' False False.rec True True.intro And And.intro And.rec Or Or.inl Or.inr Or.rec 'Nonempty.{1}' 'Nonempty.intro.{1}' 'Nonempty.rec.{1}'
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- bridge "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/bridge.mm"
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/recursive.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/rec.mm" Nat Nat.zero Nat.succ List List.nil List.cons Nat.rec List.rec
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/tree.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/tree.mm" Tree Tree.leaf Tree.node Tree.rec
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/natle.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/natle.mm" Nat.le Nat.le.refl Nat.le.step Nat.le.rec Nat.lt UInt8.size
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/setvars.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/setvars.mm" Lean.Grind.Config.casesOn Lean.Meta.Simp.Config.zeta
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/mutual.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/mutual.mm" Tm Args Tm.var Tm.app Args.nil Args.cons Tm.rec Args.rec Rose Rose.node Rose.rec Rose.rec_1
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/strings.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/strings.mm" Lean.origin String.instInhabited instToStringBool
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/axioms.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/axioms.mm" propext 'Quot.{1}' 'Quot.mk.{1}' 'Quot.ind.{1}' 'Quot.lift.{1,1}' 'Quot.{0}' 'Quot.lift.{0,1}' 'Classical.choice.{1}' 'Classical.choose.{1}' Classical.propDecidable
          grep -q '^Choice: Classical.choice is the least element in a well-ordering W of U. ran U' "$RUNNER_TEMP/mm/setmm/axioms.mm"
          # The one-universe quotient and choice stay available for comparison.
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define --single-universe tests/fixtures/axioms.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/axioms1.mm" propext Quot Quot.mk Quot.ind Quot.lift Classical.choice Classical.choose Classical.propDecidable
          # The one-universe model stays available, and in it structurally recursive definitions collapse: the old
          # bridge output proves Nat.below empty, and takes Nat.add's computation rules as hypotheses.
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- nat-bridge --single-universe tests/fixtures/natadd.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/natbridge1.mm" 2
          for g in model ind props bridge rec tree natle setvars strings axioms axioms1 mutual natbridge1; do
            out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read $g.mm" "verify proof *" "exit")
            echo "$out" | tail -2
            if echo "$out" | grep -q '?Error'; then exit 1; fi
            (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" $g.mm)
          done
      # The bridge theorems (docs/bridges.md): the model's Nat is NN0, Nat.add's computation rules are proved, so
      # ⟦Nat.add⟧ is + with no hypotheses but the tower's; literals 2, 4 and 256. Nat.add_zero and Nat.zero_add are
      # proved through the model from their proof terms (as `theorem` does) and restated in NN0: ( A + 0 ) = A.
      - name: Prove the Nat bridge and Lean theorems through the generic model, restate them in NN0, and verify
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- nat-bridge tests/fixtures/theorems.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/natbridge.mm" 2 4 256 Nat.add_zero Nat.zero_add
          grep -q 'lean-nn0-Nat.add_zero \$p |- ( ( U e. lean.-tower /\\ A e. NN0 ) -> ( A + 0 ) = A )' "$RUNNER_TEMP/mm/setmm/natbridge.mm"
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read natbridge.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" natbridge.mm)
      # The List/Word bridge (docs/bridges.md): the model's List A is set.mm's Word A, by a proved bijection W. The
      # restatement of List.length_append as ccatlen needs Nat.add's rules and List.length_append's proof (several
      # minutes); it runs in the demo job.
      # Universe elimination (docs/milestone4.md): the same proof of Nat.add_zero in a tower of weak universes, which
      # ZFC proves exists (lean-wit-tw), so the restatement ( A + 0 ) = A comes out with no universe hypothesis.
      # scripts/check-axioms reads metamath-exe's trace_back /axioms: no ax-groth, and no U left in the statement.
      - name: Prove Nat.add_zero in plain ZFC (milestone 4), verify, and check it uses no ax-groth
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- nat-bridge tests/fixtures/theorems.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/natzfc.mm" 2 Nat.add_zero --lowered
          grep -q 'lean-zfc-Nat.add_zero \$p |- ( A e. NN0 -> ( A + 0 ) = A )' "$RUNNER_TEMP/mm/setmm/natzfc.mm"
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read natzfc.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" natzfc.mm)
          scripts/check-axioms "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP/mm/setmm/natzfc.mm" lean-zfc-Nat.add_zero
          scripts/check-axioms "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP/mm/setmm/natzfc.mm" --axioms-only lean-wit-tw
          # The check must catch a universe hypothesis: the restatement before the discharge still has one.
          if scripts/check-axioms "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP/mm/setmm/natzfc.mm" lean-nn0-Nat.add_zero; then exit 1; fi
          # ...and a use of ax-groth: set.mm's inaex (inaccessibles exist) is proved from it.
          if scripts/check-axioms "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP/mm/setmm/natzfc.mm" --axioms-only inaex; then exit 1; fi
      # The multiplication bridge (docs/bridges.md): the model's Nat.mul is x. through F, its rules proved from its
      # definition; Nat.mul_zero, Nat.zero_mul and Nat.mul_succ restated in NN0, and 2 * 2 = 4 by set.mm's 2t2e4.
      - name: Prove the Nat.mul bridge, restate Lean's mul theorems in NN0, and verify
        env:
          TENET_ZFC_JAVA: java
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- nat-bridge tests/fixtures/library.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/natmul.mm" 2 4 Nat.mul_zero Nat.zero_mul Nat.mul_succ
          grep -q 'lean-nn0-Nat.mul_succ \$p |- ( ( ( U e. lean.-tower /\\ A e. NN0 ) /\\ B e. NN0 ) -> ( A x. ( B + 1 ) ) = ( ( A x. B ) + A ) )' "$RUNNER_TEMP/mm/setmm/natmul.mm"
          grep -q 'lean-nat-natmul-2t2e4 \$p' "$RUNNER_TEMP/mm/setmm/natmul.mm"
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read natmul.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" natmul.mm)
      # The order bridge (docs/bridges.md): Lean's <= and < on Nat are <_ and <, from Lean's Nat.sub_add_cancel and
      # Nat.le.intro; Nat.le_add_right restated as A <_ ( A + B ), next to the same statement from set.mm's nn0addge1.
      - name: Prove the order bridge, restate Lean's order theorems in NN0, and verify
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- nat-bridge tests/fixtures/natorder.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/natorder.mm" 2 Nat.le_add_right Nat.lt_succ_self
          grep -q 'lean-nn0-Nat.le_add_right \$p |- ( ( ( U e. lean.-tower /\\ A e. NN0 ) /\\ B e. NN0 ) -> A <_ ( A + B ) )' "$RUNNER_TEMP/mm/setmm/natorder.mm"
          grep -q 'lean-nn0-Nat.le_add_right-setmm \$p' "$RUNNER_TEMP/mm/setmm/natorder.mm"
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read natorder.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" natorder.mm)
      - name: Prove the List/Word bridge and verify
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- list-bridge tests/fixtures/library.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/listbridge.mm" --bridge-only
          grep -q 'lean-list-wf1o \$p |- ( ( U e. lean.-tower /\\ A e. ( U ` (/) ) ) -> U_ n e. _om' "$RUNNER_TEMP/mm/setmm/listbridge.mm"
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read listbridge.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" listbridge.mm)
      # The quick part of the starter library (docs/milestone3.md, "Theorems through the model"); the rest runs in
      # the theorem-library job.
      - name: Prove Lean theorems through the generic model and verify (milestone 3, theorems through the model)
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- theorem tests/fixtures/library.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/thm.mm" \
            Nat.add_zero Nat.zero_add Nat.add_succ Nat.add_one Nat.succ_eq_add_one Nat.pred_succ Nat.pred_zero Nat.sub_zero Nat.mul_zero Nat.mul_succ \
            List.length_nil List.length_cons List.nil_append List.cons_append List.append_nil List.map_nil List.map_cons List.reverse_nil
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read thm.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" thm.mm)
      # Quotients in the tower: Quot.ind's typing (every class is a class of some element), Quot.lift's (a function on
      # the classes, because of h), and its computation rule as a conversion step (Quot.liftBeta is rfl in Lean); at
      # level 0 and at level 1.
      - name: Prove Lean theorems about quotients through the generic model and verify
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- theorem tests/fixtures/quotthm.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/quotthm.mm" \
            Quot.inductionOn Quot.exists_rep Quot.liftBeta Quot.indBeta 'Quot.inductionOn.{1}' 'Quot.liftBeta.{1,1}' 'Quot.indBeta.{1}'
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read quotthm.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" quotthm.mm)
      # A type computed by a recursor on a constructor (Nat.noConfusion's at two successors), inferred under a lambda:
      # refused ("applying something that isn't a function") until type inference had the recursor's computation rule.
      - name: Prove a theorem whose type needs a recursor's computation rule, and verify
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- theorem tests/fixtures/iota.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/iota.mm" succ_inj_lam
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read iota.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" iota.mm)
      # A library of typing lemmas (docs/milestone3.md, "A library of lemmas"): two layers, the second built on the
      # first, then theorems that cite them. The output must include the library and must not prove its lemmas again.
      - name: Build a library of typing lemmas in two layers, prove theorems against it, and verify all three files
        run: |
          mm="$RUNNER_TEMP/mm/setmm"
          tz() { dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- "$@"; }
          tz library tests/fixtures/library.ndjson "$mm/set.mm" "$mm/lib1.mm" Nat.succ_add Nat.add_succ lean-ty-Nat.add_zero 'Eq.{1}'
          tz library tests/fixtures/library.ndjson "$mm/set.mm" "$mm/lib2.mm" Nat.add_comm Nat.succ_add --library "$mm/lib1.mm" | tee "$RUNNER_TEMP/lib2.log"
          grep -q '^Nat.succ_add: lean-ty-Nat.succ_add (already in the library' "$RUNNER_TEMP/lib2.log"
          tz theorem tests/fixtures/library.ndjson "$mm/set.mm" "$mm/libthm.mm" Nat.add_comm Nat.add_assoc Nat.add_left_comm --library "$mm/lib2.mm" | tee "$RUNNER_TEMP/libthm.log"
          grep -q 'typing lemmas cited, not proved again' "$RUNNER_TEMP/libthm.log"
          grep -q '^\$\[ lib1.mm \$\]' "$mm/lib2.mm"
          grep -q '^\$\[ lib2.mm \$\]' "$mm/libthm.mm"
          grep -q '^ *lean-ty-Nat.succ_add \$p' "$mm/lib1.mm"
          if grep -q '^ *lean-ty-Nat.succ_add \$p' "$mm/lib2.mm" "$mm/libthm.mm"; then echo "a library lemma was proved again"; exit 1; fi
          for g in lib1 lib2 libthm; do
            out=$(cd "$mm" && "$RUNNER_TEMP/mm/metamath" "read $g.mm" "verify proof lean-*" "exit")
            echo "$out" | tail -2
            if echo "$out" | grep -q '?Error'; then exit 1; fi
            (cd "$mm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" "$g.mm")
          done
      - name: Check the translated definitions with mmj2's definitionCheck (milestone 3, step 2)
        run: |
          for g in model ind props rec tree natle setvars strings axioms axioms1 mutual natbridge1 natbridge natmul natorder natzfc listbridge thm quotthm iota lib1 lib2 libthm; do scripts/check-definitions java "$RUNNER_TEMP/mm/mmj2" "$RUNNER_TEMP/mm/setmm/$g.mm"; done
      # The Init-wide run (docs/milestone3.md) in miniature: define-all on a small export, in two chunks, and
      # scripts/verify-all with all three checkers. The full run on Init is too big for CI.
      - name: define-all and verify-all on a small export (milestone 3 at scale)
        env:
          TENET_ZFC_SETMM: ${{ runner.temp }}/mm/setmm
          TENET_ZFC_METAMATH: ${{ runner.temp }}/mm/metamath
          TENET_ZFC_MMVERIFY: ${{ runner.temp }}/mm/mmverify/mmverify.py
          TENET_ZFC_JAVA: java
          TENET_ZFC_MMJ2: ${{ runner.temp }}/mm/mmj2
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define-all tests/fixtures/natle.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/defall" --chunk-size 8
          if grep -qP '\t(refused|error)\t' "$RUNNER_TEMP"/defall/chunk-*.tsv; then cat "$RUNNER_TEMP"/defall/chunk-*.tsv; exit 1; fi
          scripts/verify-all -j 2 "$RUNNER_TEMP/defall"
      # Theorems at scale (docs/milestone3.md, "Theorems across Init") in miniature: theorem-all on a fixture cut from
      # Init (scripts/subset-export), in two chunks, and verify-all. Refusals are expected (Nat.le, Quot.sound); a
      # translator error, a crash or a timeout is not, and neither is fewer theorems proved than recorded.
      - name: theorem-all and verify-all on a small export (theorems at scale)
        env:
          TENET_ZFC_SETMM: ${{ runner.temp }}/mm/setmm
          TENET_ZFC_METAMATH: ${{ runner.temp }}/mm/metamath
          TENET_ZFC_MMVERIFY: ${{ runner.temp }}/mm/mmverify/mmverify.py
          TENET_ZFC_JAVA: java
          TENET_ZFC_MMJ2: ${{ runner.temp }}/mm/mmj2
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- theorem-all tests/fixtures/theoremall.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/thmall" --chunk-size 20 --budget 120
          cat "$RUNNER_TEMP"/thmall/chunk-*.tsv
          if grep -qP '\t(error|crash|timeout)\t' "$RUNNER_TEMP"/thmall/chunk-*.tsv; then exit 1; fi
          proved=$(cat "$RUNNER_TEMP"/thmall/chunk-*.tsv | grep -cP '\tproved\t')
          echo "proved: $proved of 23"
          [ "$proved" -ge 23 ] || exit 1
          scripts/verify-all -j 2 "$RUNNER_TEMP/thmall"
          scripts/summarize-all "$RUNNER_TEMP/thmall"
          # Theorems the Init sample's blockers stopped, fixed since (docs/milestone3.md, "Theorems across Init"): $d traps
          # under binders (Nat.succ_mul, maxOn_eq_minOn), Decidable's proof field, literals past 10 (Char.ext), and
          # Nat.le's constructors. Every one must prove.
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- theorem-all tests/fixtures/blockers.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/blk" --chunk-size 16 --budget 120
          if grep -vqP '\tproved\t|^name\t' "$RUNNER_TEMP"/blk/chunk-*.tsv; then cat "$RUNNER_TEMP"/blk/chunk-*.tsv; exit 1; fi
          scripts/verify-all -j 2 "$RUNNER_TEMP/blk"
      # Every output above passed all three checks; keep them, for the release workflow to attach.
      - name: Collect the verified outputs
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          for g in gate lenapp lenapp-flat model ind props bridge rec tree natle setvars strings axioms mutual natbridge1 natbridge natzfc thm; do cp "$RUNNER_TEMP/mm/setmm/$g.mm" "$RUNNER_TEMP/verified/"; done
          printf 'Checked by metamath-exe %s, mmverify.py %s and mmj2 %s (definitionCheck)\nagainst set.mm %s, by tenet-zfc at %s.\nEach file includes set.mm by name: put it beside them to check them again.\n' \
            "$METAMATH_EXE_COMMIT" "$MMVERIFY_COMMIT" "$MMJ2_COMMIT" "$SETMM_COMMIT" "$GITHUB_SHA" > "$RUNNER_TEMP/verified/VERIFIED.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-outputs
          path: ${{ runner.temp }}/verified

  # The whole starter library, the heavy theorems included (induction with large motives: Nat.succ_add,
  # List.length_append, List.append_assoc, ...), checked by all three checkers. By hand (workflow_dispatch), weekly,
  # and on a release tag, so a release is never cut without it.
  theorem-library:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SETMM_COMMIT: 6315535f37e5e58d14ece8c34ddb204926446264
      METAMATH_EXE_COMMIT: 580b4bd5ae6f2a0d746398b0033cddccba1b418b
      MMVERIFY_COMMIT: 63a2aa3815cd5bf67892dbfc7f2048cbb177524c
      MMJ2_COMMIT: c8dd05548139c7003220caedde65a7abe44a00bf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
      - name: Fetch set.mm and the checkers
        run: |
          mkdir -p "$RUNNER_TEMP/mm/setmm" "$RUNNER_TEMP/mm/mmj2/macros"
          curl -fsSL -o "$RUNNER_TEMP/mm/setmm/set.mm" "https://raw.githubusercontent.com/metamath/set.mm/$SETMM_COMMIT/set.mm"
          git clone -q https://github.com/metamath/metamath-exe "$RUNNER_TEMP/mm/metamath-exe"
          git -C "$RUNNER_TEMP/mm/metamath-exe" checkout -q "$METAMATH_EXE_COMMIT"
          cc -O2 -w -o "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP"/mm/metamath-exe/src/*.c
          git clone -q https://github.com/david-a-wheeler/mmverify.py "$RUNNER_TEMP/mm/mmverify"
          git -C "$RUNNER_TEMP/mm/mmverify" checkout -q "$MMVERIFY_COMMIT"
          raw="https://raw.githubusercontent.com/digama0/mmj2/$MMJ2_COMMIT/mmj2jar"
          curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/mmj2.jar" "$raw/mmj2.jar"
          for m in definitionCheck init; do curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/macros/$m.js" "$raw/macros/$m.js"; done
      - name: Prove the starter library through the generic model
        run: |
          # Nat.succ_ne_zero and Nat.le_refl are refused (docs/milestone3.md); the step fails if any other is.
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- theorem tests/fixtures/library.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/library.mm" \
            Nat.add_zero Nat.zero_add Nat.succ_add Nat.add_succ Nat.add_one Nat.succ_eq_add_one Nat.add_comm Nat.add_assoc Nat.add_left_comm Nat.add_right_comm \
            Nat.pred_succ Nat.pred_zero Nat.sub_zero Nat.succ_sub_succ Nat.mul_zero Nat.mul_succ Nat.zero_mul \
            List.length_nil List.length_cons List.length_append List.nil_append List.cons_append List.append_nil List.append_assoc \
            List.map_nil List.map_cons List.length_map List.reverse_nil
      - name: Check it with metamath-exe, mmverify.py and mmj2's definitionCheck
        run: |
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read library.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" library.mm)
          scripts/check-definitions java "$RUNNER_TEMP/mm/mmj2" "$RUNNER_TEMP/mm/setmm/library.mm"

  # The headline demo (docs/demo.md): Lean's List.length_append through the model and the List/Word bridge, restated
  # as set.mm's ccatlen next to set.mm's own proof, checked by all three checkers; then the sabotage checks (a corrupted
  # proof step, + changed to x., a broken Lean proof), each of which must be rejected. By hand, weekly and on a release tag.
  demo:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SETMM_COMMIT: 6315535f37e5e58d14ece8c34ddb204926446264
      METAMATH_EXE_COMMIT: 580b4bd5ae6f2a0d746398b0033cddccba1b418b
      MMVERIFY_COMMIT: 63a2aa3815cd5bf67892dbfc7f2048cbb177524c
      MMJ2_COMMIT: c8dd05548139c7003220caedde65a7abe44a00bf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
      - name: Fetch set.mm and the checkers
        run: |
          mkdir -p "$RUNNER_TEMP/mm/setmm" "$RUNNER_TEMP/mm/mmj2/macros"
          curl -fsSL -o "$RUNNER_TEMP/mm/setmm/set.mm" "https://raw.githubusercontent.com/metamath/set.mm/$SETMM_COMMIT/set.mm"
          git clone -q https://github.com/metamath/metamath-exe "$RUNNER_TEMP/mm/metamath-exe"
          git -C "$RUNNER_TEMP/mm/metamath-exe" checkout -q "$METAMATH_EXE_COMMIT"
          cc -O2 -w -o "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP"/mm/metamath-exe/src/*.c
          git clone -q https://github.com/david-a-wheeler/mmverify.py "$RUNNER_TEMP/mm/mmverify"
          git -C "$RUNNER_TEMP/mm/mmverify" checkout -q "$MMVERIFY_COMMIT"
          raw="https://raw.githubusercontent.com/digama0/mmj2/$MMJ2_COMMIT/mmj2jar"
          curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/mmj2.jar" "$raw/mmj2.jar"
          for m in definitionCheck init; do curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/macros/$m.js" "$raw/macros/$m.js"; done
      - name: Run the demo
        env:
          TENET_ZFC_SETMM: ${{ runner.temp }}/mm/setmm/set.mm
          TENET_ZFC_METAMATH: ${{ runner.temp }}/mm/metamath
          TENET_ZFC_MMVERIFY: ${{ runner.temp }}/mm/mmverify/mmverify.py
          TENET_ZFC_JAVA: java
          TENET_ZFC_MMJ2: ${{ runner.temp }}/mm/mmj2
        run: set -o pipefail; scripts/demo "$RUNNER_TEMP/demo" | tee "$RUNNER_TEMP/demo.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo
          path: |
            ${{ runner.temp }}/demo.log
            ${{ runner.temp }}/demo/demo.mm

  # The README's worked example, end to end: Lean compiles tests/fixtures/Example.lean, leanout exports it, Tenet traces
  # its theorem, tenet-zfc translates every declaration, and all three checkers check the outputs.
  run-example:
    runs-on: ubuntu-latest
    env:
      SETMM_COMMIT: 6315535f37e5e58d14ece8c34ddb204926446264
      METAMATH_EXE_COMMIT: 580b4bd5ae6f2a0d746398b0033cddccba1b418b
      MMVERIFY_COMMIT: 63a2aa3815cd5bf67892dbfc7f2048cbb177524c
      MMJ2_COMMIT: c8dd05548139c7003220caedde65a7abe44a00bf
      LEANOUT_COMMIT: 0562d84c5bad6e94f6c330754d61e51324fc905e
      TENET_COMMIT: b35e92a31fd2988e8f0f6ded6f66a5248f7ad8d0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
      - name: Fetch set.mm and the checkers
        run: |
          mkdir -p "$RUNNER_TEMP/mm/setmm" "$RUNNER_TEMP/mm/mmj2/macros"
          curl -fsSL -o "$RUNNER_TEMP/mm/setmm/set.mm" "https://raw.githubusercontent.com/metamath/set.mm/$SETMM_COMMIT/set.mm"
          git clone -q https://github.com/metamath/metamath-exe "$RUNNER_TEMP/mm/metamath-exe"
          git -C "$RUNNER_TEMP/mm/metamath-exe" checkout -q "$METAMATH_EXE_COMMIT"
          cc -O2 -w -o "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP"/mm/metamath-exe/src/*.c
          git clone -q https://github.com/david-a-wheeler/mmverify.py "$RUNNER_TEMP/mm/mmverify"
          git -C "$RUNNER_TEMP/mm/mmverify" checkout -q "$MMVERIFY_COMMIT"
          raw="https://raw.githubusercontent.com/digama0/mmj2/$MMJ2_COMMIT/mmj2jar"
          curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/mmj2.jar" "$raw/mmj2.jar"
          for m in definitionCheck init; do curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/macros/$m.js" "$raw/macros/$m.js"; done
      - name: Install elan, and build leanout and Tenet
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone -q https://github.com/keithadler/leanout "$RUNNER_TEMP/leanout"
          git -C "$RUNNER_TEMP/leanout" checkout -q "$LEANOUT_COMMIT"
          (cd "$RUNNER_TEMP/leanout" && lake build leanout)
          git clone -q https://github.com/keithadler/tenet "$RUNNER_TEMP/tenet"
          git -C "$RUNNER_TEMP/tenet" checkout -q "$TENET_COMMIT"
          dotnet build "$RUNNER_TEMP/tenet/src/Tenet.Cli" -c Release -f net10.0 -o "$RUNNER_TEMP/tenet-bin"
      - run: dotnet build src/TenetZfc.Cli -c Release -f net10.0
      - name: tenet-zfc run tests/fixtures/Example.lean
        env:
          TENET_ZFC_SETMM: ${{ runner.temp }}/mm/setmm
          TENET_ZFC_METAMATH: ${{ runner.temp }}/mm/metamath
          TENET_ZFC_MMVERIFY: ${{ runner.temp }}/mm/mmverify/mmverify.py
          TENET_ZFC_JAVA: java
          TENET_ZFC_MMJ2: ${{ runner.temp }}/mm/mmj2
          TENET_ZFC_LEANOUT: ${{ runner.temp }}/leanout/.lake/build/bin/leanout
          TENET_ZFC_TENET: ${{ runner.temp }}/tenet-bin/tenet
        run: |
          dotnet src/TenetZfc.Cli/bin/Release/net10.0/tenet-zfc.dll run tests/fixtures/Example.lean --out "$RUNNER_TEMP/example-run"
          rm -rf "$RUNNER_TEMP/example-run/set.mm" "$RUNNER_TEMP/example-run/macros" "$RUNNER_TEMP/example-run/build"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-run
          path: ${{ runner.temp }}/example-run
