name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of CI first, and attaches the outputs it verified.
  workflow_call:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      # Replay every committed trace through the command-line tool as well, so the exit status is exercised.
      - name: Replay the fixture traces
        shell: bash
        run: |
          for f in Nat.add_succ Nat.add_succ.v3.0 eta437 acc436 quot syntax gate lenapp; do
            dotnet src/TenetZfc.Cli/bin/Release/net10.0/tenet-zfc.dll replay tests/fixtures/$f.ndjson tests/fixtures/$f.trace.ndjson
          done
      # The packaged tool: install it from its .nupkg and run it, so packaging and `run` are exercised on every OS.
      - name: Pack the dotnet tool, install it and run it
        shell: bash
        run: |
          dotnet pack src/TenetZfc.Cli -c Release --no-build -o "$RUNNER_TEMP/pkg"
          dotnet tool install tenet-zfc --tool-path "$RUNNER_TEMP/tool" --add-source "$RUNNER_TEMP/pkg" --prerelease
          "$RUNNER_TEMP/tool/tenet-zfc" --version
          curl -fsSL -o "$RUNNER_TEMP/set.mm" "https://raw.githubusercontent.com/metamath/set.mm/6315535f37e5e58d14ece8c34ddb204926446264/set.mm"
          "$RUNNER_TEMP/tool/tenet-zfc" run tests/fixtures/inductives.ndjson --decl Bool,Bool.true,Bool.false,Bool.rec --setmm "$RUNNER_TEMP/set.mm" --no-verify --out "$RUNNER_TEMP/run-out"

  # Emit set.mm proofs and check them with both Metamath verifiers. The tools and set.mm are pinned, so a run
  # verifies against exactly the database the proofs were written for.
  emit-and-verify:
    runs-on: ubuntu-latest
    env:
      SETMM_COMMIT: 6315535f37e5e58d14ece8c34ddb204926446264
      METAMATH_EXE_COMMIT: 580b4bd5ae6f2a0d746398b0033cddccba1b418b
      MMVERIFY_COMMIT: 63a2aa3815cd5bf67892dbfc7f2048cbb177524c
      MMJ2_COMMIT: c8dd05548139c7003220caedde65a7abe44a00bf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # mmj2's definitionCheck macro needs a JDK with Nashorn: Java 11, as set.mm's own CI uses.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
      - name: Fetch set.mm and the verifiers
        run: |
          mkdir -p "$RUNNER_TEMP/mm/setmm"
          curl -fsSL -o "$RUNNER_TEMP/mm/setmm/set.mm" "https://raw.githubusercontent.com/metamath/set.mm/$SETMM_COMMIT/set.mm"
          git clone -q https://github.com/metamath/metamath-exe "$RUNNER_TEMP/mm/metamath-exe"
          git -C "$RUNNER_TEMP/mm/metamath-exe" checkout -q "$METAMATH_EXE_COMMIT"
          cc -O2 -w -o "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP"/mm/metamath-exe/src/*.c
          git clone -q https://github.com/david-a-wheeler/mmverify.py "$RUNNER_TEMP/mm/mmverify"
          git -C "$RUNNER_TEMP/mm/mmverify" checkout -q "$MMVERIFY_COMMIT"
      - name: Both verifiers accept set.mm itself
        working-directory: ${{ runner.temp }}/mm/setmm
        run: |
          out=$("$RUNNER_TEMP/mm/metamath" "read set.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" set.mm
      - name: Tests, with emitted proofs checked by both verifiers
        env:
          TENET_ZFC_SETMM: ${{ runner.temp }}/mm/setmm
          TENET_ZFC_METAMATH: ${{ runner.temp }}/mm/metamath
          TENET_ZFC_MMVERIFY: ${{ runner.temp }}/mm/mmverify/mmverify.py
        run: dotnet test tests/TenetZfc.Tests -c Release -f net10.0
      - name: Emit the gate theorems and verify them
        run: |
          for g in gate lenapp; do
            dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- emit tests/fixtures/$g.ndjson tests/fixtures/$g.trace.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/$g.mm"
            out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read $g.mm" "verify proof *" "exit")
            echo "$out" | tail -2
            if echo "$out" | grep -q '?Error'; then exit 1; fi
            (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" $g.mm)
          done
      # Proofs are compressed by default; the flat form stays available behind --uncompressed.
      - name: Emit lenapp with flat proofs and verify it
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- emit tests/fixtures/lenapp.ndjson tests/fixtures/lenapp.trace.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/lenapp-flat.mm" --uncompressed
          if grep -q '^ *( ' "$RUNNER_TEMP/mm/setmm/lenapp-flat.mm"; then echo "lenapp-flat.mm has compressed proofs"; exit 1; fi
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read lenapp-flat.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" lenapp-flat.mm)
      - name: Translate definitions and inductive types by the generic model and verify (milestone 3)
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/model.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/model.mm" id Function.comp Function.const
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/inductives.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/ind.mm" Bool Bool.false Bool.true Prod Prod.mk Option Option.none Option.some Bool.rec Prod.rec Option.rec
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/props.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/props.mm" Eq Eq.refl Eq.rec HEq HEq.refl HEq.rec False False.rec True True.intro And And.intro And.rec Or Or.inl Or.inr Or.rec Nonempty Nonempty.intro Nonempty.rec
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- bridge "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/bridge.mm"
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/recursive.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/rec.mm" Nat Nat.zero Nat.succ List List.nil List.cons Nat.rec List.rec
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/tree.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/tree.mm" Tree Tree.leaf Tree.node Tree.rec
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/natle.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/natle.mm" Nat.le Nat.le.refl Nat.le.step Nat.le.rec Nat.lt UInt8.size
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/setvars.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/setvars.mm" Lean.Grind.Config.casesOn Lean.Meta.Simp.Config.zeta
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/mutual.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/mutual.mm" Tm Args Tm.var Tm.app Args.nil Args.cons Tm.rec Args.rec Rose Rose.node Rose.rec Rose.rec_1
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/strings.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/strings.mm" Lean.origin String.instInhabited instToStringBool
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/axioms.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/axioms.mm" propext Quot Quot.mk Quot.ind Quot.lift Classical.choice Classical.choose Classical.propDecidable
          # The bridge theorems: the model's Nat is NN0 (docs/bridges.md), with literals 2, 4 and 256.
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- nat-bridge tests/fixtures/natadd.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/natbridge.mm" 2 4 256
          for g in model ind props bridge rec tree natle setvars strings axioms mutual natbridge; do
            out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read $g.mm" "verify proof *" "exit")
            echo "$out" | tail -2
            if echo "$out" | grep -q '?Error'; then exit 1; fi
            (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" $g.mm)
          done
      - name: Prove Lean theorems through the generic model and verify (milestone 3, theorems through the model)
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- theorem tests/fixtures/theorems.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/thm.mm" Nat.add_zero Nat.zero_add
          out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read thm.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" thm.mm)
      - name: Check the translated definitions with mmj2's definitionCheck (milestone 3, step 2)
        run: |
          mkdir -p "$RUNNER_TEMP/mm/mmj2/macros"
          raw="https://raw.githubusercontent.com/digama0/mmj2/$MMJ2_COMMIT/mmj2jar"
          curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/mmj2.jar" "$raw/mmj2.jar"
          for m in definitionCheck init; do curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/macros/$m.js" "$raw/macros/$m.js"; done
          for g in model ind props rec tree natle setvars strings axioms mutual natbridge thm; do scripts/check-definitions java "$RUNNER_TEMP/mm/mmj2" "$RUNNER_TEMP/mm/setmm/$g.mm"; done
      # Every output above passed all three checks; keep them, for the release workflow to attach.
      - name: Collect the verified outputs
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          for g in gate lenapp lenapp-flat model ind props bridge rec tree natle setvars strings axioms mutual natbridge thm; do cp "$RUNNER_TEMP/mm/setmm/$g.mm" "$RUNNER_TEMP/verified/"; done
          printf 'Checked by metamath-exe %s, mmverify.py %s and mmj2 %s (definitionCheck)\nagainst set.mm %s, by tenet-zfc at %s.\nEach file includes set.mm by name: put it beside them to check them again.\n' \
            "$METAMATH_EXE_COMMIT" "$MMVERIFY_COMMIT" "$MMJ2_COMMIT" "$SETMM_COMMIT" "$GITHUB_SHA" > "$RUNNER_TEMP/verified/VERIFIED.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-outputs
          path: ${{ runner.temp }}/verified

  # The README's worked example, end to end: Lean compiles tests/fixtures/Example.lean, leanout exports it, Tenet traces
  # its theorem, tenet-zfc translates every declaration, and all three checkers check the outputs.
  run-example:
    runs-on: ubuntu-latest
    env:
      SETMM_COMMIT: 6315535f37e5e58d14ece8c34ddb204926446264
      METAMATH_EXE_COMMIT: 580b4bd5ae6f2a0d746398b0033cddccba1b418b
      MMVERIFY_COMMIT: 63a2aa3815cd5bf67892dbfc7f2048cbb177524c
      MMJ2_COMMIT: c8dd05548139c7003220caedde65a7abe44a00bf
      LEANOUT_COMMIT: 0562d84c5bad6e94f6c330754d61e51324fc905e
      TENET_COMMIT: b35e92a31fd2988e8f0f6ded6f66a5248f7ad8d0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
      - name: Fetch set.mm and the checkers
        run: |
          mkdir -p "$RUNNER_TEMP/mm/setmm" "$RUNNER_TEMP/mm/mmj2/macros"
          curl -fsSL -o "$RUNNER_TEMP/mm/setmm/set.mm" "https://raw.githubusercontent.com/metamath/set.mm/$SETMM_COMMIT/set.mm"
          git clone -q https://github.com/metamath/metamath-exe "$RUNNER_TEMP/mm/metamath-exe"
          git -C "$RUNNER_TEMP/mm/metamath-exe" checkout -q "$METAMATH_EXE_COMMIT"
          cc -O2 -w -o "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP"/mm/metamath-exe/src/*.c
          git clone -q https://github.com/david-a-wheeler/mmverify.py "$RUNNER_TEMP/mm/mmverify"
          git -C "$RUNNER_TEMP/mm/mmverify" checkout -q "$MMVERIFY_COMMIT"
          raw="https://raw.githubusercontent.com/digama0/mmj2/$MMJ2_COMMIT/mmj2jar"
          curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/mmj2.jar" "$raw/mmj2.jar"
          for m in definitionCheck init; do curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/macros/$m.js" "$raw/macros/$m.js"; done
      - name: Install elan, and build leanout and Tenet
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone -q https://github.com/keithadler/leanout "$RUNNER_TEMP/leanout"
          git -C "$RUNNER_TEMP/leanout" checkout -q "$LEANOUT_COMMIT"
          (cd "$RUNNER_TEMP/leanout" && lake build leanout)
          git clone -q https://github.com/keithadler/tenet "$RUNNER_TEMP/tenet"
          git -C "$RUNNER_TEMP/tenet" checkout -q "$TENET_COMMIT"
          dotnet build "$RUNNER_TEMP/tenet/src/Tenet.Cli" -c Release -f net10.0 -o "$RUNNER_TEMP/tenet-bin"
      - run: dotnet build src/TenetZfc.Cli -c Release -f net10.0
      - name: tenet-zfc run tests/fixtures/Example.lean
        env:
          TENET_ZFC_SETMM: ${{ runner.temp }}/mm/setmm
          TENET_ZFC_METAMATH: ${{ runner.temp }}/mm/metamath
          TENET_ZFC_MMVERIFY: ${{ runner.temp }}/mm/mmverify/mmverify.py
          TENET_ZFC_JAVA: java
          TENET_ZFC_MMJ2: ${{ runner.temp }}/mm/mmj2
          TENET_ZFC_LEANOUT: ${{ runner.temp }}/leanout/.lake/build/bin/leanout
          TENET_ZFC_TENET: ${{ runner.temp }}/tenet-bin/tenet
        run: |
          dotnet src/TenetZfc.Cli/bin/Release/net10.0/tenet-zfc.dll run tests/fixtures/Example.lean --out "$RUNNER_TEMP/example-run"
          rm -rf "$RUNNER_TEMP/example-run/set.mm" "$RUNNER_TEMP/example-run/macros" "$RUNNER_TEMP/example-run/build"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-run
          path: ${{ runner.temp }}/example-run
