name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      # Replay every committed trace through the command-line tool as well, so the exit status is exercised.
      - name: Replay the fixture traces
        shell: bash
        run: |
          for f in Nat.add_succ Nat.add_succ.v3.0 eta437 acc436 quot syntax gate lenapp; do
            dotnet src/TenetZfc.Cli/bin/Release/net10.0/tenet-zfc.dll replay tests/fixtures/$f.ndjson tests/fixtures/$f.trace.ndjson
          done

  # Emit set.mm proofs and check them with both Metamath verifiers. The tools and set.mm are pinned, so a run
  # verifies against exactly the database the proofs were written for.
  emit-and-verify:
    runs-on: ubuntu-latest
    env:
      SETMM_COMMIT: 6315535f37e5e58d14ece8c34ddb204926446264
      METAMATH_EXE_COMMIT: 580b4bd5ae6f2a0d746398b0033cddccba1b418b
      MMVERIFY_COMMIT: 63a2aa3815cd5bf67892dbfc7f2048cbb177524c
      MMJ2_COMMIT: c8dd05548139c7003220caedde65a7abe44a00bf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # mmj2's definitionCheck macro needs a JDK with Nashorn: Java 11, as set.mm's own CI uses.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
      - name: Fetch set.mm and the verifiers
        run: |
          mkdir -p "$RUNNER_TEMP/mm/setmm"
          curl -fsSL -o "$RUNNER_TEMP/mm/setmm/set.mm" "https://raw.githubusercontent.com/metamath/set.mm/$SETMM_COMMIT/set.mm"
          git clone -q https://github.com/metamath/metamath-exe "$RUNNER_TEMP/mm/metamath-exe"
          git -C "$RUNNER_TEMP/mm/metamath-exe" checkout -q "$METAMATH_EXE_COMMIT"
          cc -O2 -w -o "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP"/mm/metamath-exe/src/*.c
          git clone -q https://github.com/david-a-wheeler/mmverify.py "$RUNNER_TEMP/mm/mmverify"
          git -C "$RUNNER_TEMP/mm/mmverify" checkout -q "$MMVERIFY_COMMIT"
      - name: Both verifiers accept set.mm itself
        working-directory: ${{ runner.temp }}/mm/setmm
        run: |
          out=$("$RUNNER_TEMP/mm/metamath" "read set.mm" "verify proof *" "exit")
          echo "$out" | tail -2
          if echo "$out" | grep -q '?Error'; then exit 1; fi
          python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" set.mm
      - name: Tests, with emitted proofs checked by both verifiers
        env:
          TENET_ZFC_SETMM: ${{ runner.temp }}/mm/setmm
          TENET_ZFC_METAMATH: ${{ runner.temp }}/mm/metamath
          TENET_ZFC_MMVERIFY: ${{ runner.temp }}/mm/mmverify/mmverify.py
        run: dotnet test tests/TenetZfc.Tests -c Release -f net10.0
      - name: Emit the gate theorems and verify them
        run: |
          for g in gate lenapp; do
            dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- emit tests/fixtures/$g.ndjson tests/fixtures/$g.trace.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/$g.mm"
            out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read $g.mm" "verify proof *" "exit")
            echo "$out" | tail -2
            if echo "$out" | grep -q '?Error'; then exit 1; fi
            (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" $g.mm)
          done
      - name: Translate definitions and inductive types by the generic model and verify (milestone 3)
        run: |
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/model.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/model.mm" id Function.comp Function.const
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/inductives.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/ind.mm" Bool Bool.false Bool.true Prod Prod.mk Option Option.none Option.some Bool.rec Prod.rec Option.rec
          dotnet run --project src/TenetZfc.Cli -c Release -f net10.0 -- define tests/fixtures/props.ndjson "$RUNNER_TEMP/mm/setmm/set.mm" "$RUNNER_TEMP/mm/setmm/props.mm" Eq Eq.refl Eq.rec HEq HEq.refl HEq.rec False False.rec True True.intro And And.intro And.rec Or Or.inl Or.inr Or.rec Nonempty Nonempty.intro Nonempty.rec
          for g in model ind props; do
            out=$(cd "$RUNNER_TEMP/mm/setmm" && "$RUNNER_TEMP/mm/metamath" "read $g.mm" "verify proof *" "exit")
            echo "$out" | tail -2
            if echo "$out" | grep -q '?Error'; then exit 1; fi
            (cd "$RUNNER_TEMP/mm/setmm" && python3 -I "$RUNNER_TEMP/mm/mmverify/mmverify.py" $g.mm)
          done
      - name: Check the translated definitions with mmj2's definitionCheck (milestone 3, step 2)
        run: |
          mkdir -p "$RUNNER_TEMP/mm/mmj2/macros"
          raw="https://raw.githubusercontent.com/digama0/mmj2/$MMJ2_COMMIT/mmj2jar"
          curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/mmj2.jar" "$raw/mmj2.jar"
          for m in definitionCheck init; do curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/macros/$m.js" "$raw/macros/$m.js"; done
          for g in model ind props; do scripts/check-definitions java "$RUNNER_TEMP/mm/mmj2" "$RUNNER_TEMP/mm/setmm/$g.mm"; done
