name: Headline theorem

# The candidate headline theorem (examples/Primes.lean, the infinitude of primes in core Lean), end to end:
# Lean compiles it, leanout exports it, tenet-zfc run proves each of its theorems through the model, and
# metamath-exe, mmverify.py and mmj2's definitionCheck check the outputs. This is a measurement, not a gate: a
# theorem the model refuses, or runs out of time on, is reported in the run's summary, and only a tool or usage
# error fails the job.
#
# Run it by hand (Actions → Headline theorem → Run workflow), or change the example or this file in a pull request.

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: Seconds allowed per theorem
        default: '3000'
  pull_request:
    paths:
      - examples/Primes.lean
      - .github/workflows/headline.yml

permissions:
  contents: read

jobs:
  primes:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SETMM_COMMIT: 6315535f37e5e58d14ece8c34ddb204926446264
      METAMATH_EXE_COMMIT: 580b4bd5ae6f2a0d746398b0033cddccba1b418b
      MMVERIFY_COMMIT: 63a2aa3815cd5bf67892dbfc7f2048cbb177524c
      MMJ2_COMMIT: c8dd05548139c7003220caedde65a7abe44a00bf
      LEANOUT_COMMIT: 0562d84c5bad6e94f6c330754d61e51324fc905e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
      - name: Fetch set.mm and the checkers
        run: |
          mkdir -p "$RUNNER_TEMP/mm/setmm" "$RUNNER_TEMP/mm/mmj2/macros"
          curl -fsSL -o "$RUNNER_TEMP/mm/setmm/set.mm" "https://raw.githubusercontent.com/metamath/set.mm/$SETMM_COMMIT/set.mm"
          git clone -q https://github.com/metamath/metamath-exe "$RUNNER_TEMP/mm/metamath-exe"
          git -C "$RUNNER_TEMP/mm/metamath-exe" checkout -q "$METAMATH_EXE_COMMIT"
          cc -O2 -w -o "$RUNNER_TEMP/mm/metamath" "$RUNNER_TEMP"/mm/metamath-exe/src/*.c
          git clone -q https://github.com/david-a-wheeler/mmverify.py "$RUNNER_TEMP/mm/mmverify"
          git -C "$RUNNER_TEMP/mm/mmverify" checkout -q "$MMVERIFY_COMMIT"
          raw="https://raw.githubusercontent.com/digama0/mmj2/$MMJ2_COMMIT/mmj2jar"
          curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/mmj2.jar" "$raw/mmj2.jar"
          for m in definitionCheck init; do curl -sSfL -o "$RUNNER_TEMP/mm/mmj2/macros/$m.js" "$raw/macros/$m.js"; done
      - name: Install elan and build leanout
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone -q https://github.com/keithadler/leanout "$RUNNER_TEMP/leanout"
          git -C "$RUNNER_TEMP/leanout" checkout -q "$LEANOUT_COMMIT"
          (cd "$RUNNER_TEMP/leanout" && lake build leanout)
      - run: dotnet build src/TenetZfc.Cli -c Release -f net10.0
      - name: tenet-zfc run examples/Primes.lean
        env:
          TENET_ZFC_SETMM: ${{ runner.temp }}/mm/setmm
          TENET_ZFC_METAMATH: ${{ runner.temp }}/mm/metamath
          TENET_ZFC_MMVERIFY: ${{ runner.temp }}/mm/mmverify/mmverify.py
          TENET_ZFC_JAVA: java
          TENET_ZFC_MMJ2: ${{ runner.temp }}/mm/mmj2
          TENET_ZFC_LEANOUT: ${{ runner.temp }}/leanout/.lake/build/bin/leanout
          TIMEOUT: ${{ inputs.timeout || '3000' }}
        run: |
          set -o pipefail   # the status below is tenet-zfc's, not tee's
          out="$RUNNER_TEMP/primes-run"
          status=0
          dotnet src/TenetZfc.Cli/bin/Release/net10.0/tenet-zfc.dll run examples/Primes.lean --out "$out" --no-trace --timeout "$TIMEOUT" 2>&1 | tee "$RUNNER_TEMP/primes-run.txt" || status=$?
          rm -rf "$out/set.mm" "$out/macros" "$out/build"
          cp "$RUNNER_TEMP/primes-run.txt" "$out/run.txt" 2>/dev/null || true
          {
            echo "## The infinitude of primes through the model"
            echo
            echo "\`tenet-zfc run\` ended with status $status (0: every declaration proved; 1: some refused or failed)."
            echo
            if [ -f "$out/report.json" ]; then
              echo "| declaration | kind | status | detail |"
              echo "|---|---|---|---|"
              python3 -c "
          import json, sys
          for d in json.load(open(sys.argv[1]))['declarations']:
              detail = (d.get('detail') or d.get('file') or '').replace('|', '/').replace('\n', ' ')[:200]
              print(f\"| \`{d['name']}\` | {d['kind']} | {d['status']} | {detail} |\")
          " "$out/report.json"
            else
              echo "No report.json was written."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Refusals and failures are the measurement; only a usage, tool or file error fails the job.
          [ "$status" -le 1 ] || exit "$status"
          [ -f "$out/report.json" ] || { echo "no report.json"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primes-run
          path: ${{ runner.temp }}/primes-run
          retention-days: 30
